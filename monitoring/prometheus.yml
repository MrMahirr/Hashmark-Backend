global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Backend: yönetim portu (8081), yalnızca iç ağ
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8081"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Dışarıdan bakış: kullanıcının gördüğü adres (uptime + TLS sertifika süresi)
  - job_name: blackbox-https
    metrics_path: /probe
    params:
      module: [https_2xx]
    static_configs:
      - targets:
          - https://hashmark.yunusemremahir.com.tr/
          - https://hashmark.yunusemremahir.com.tr/api/v1/public/stats
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
