name: ci

on:
  push:
    branches: [main, master, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (birim + gerçek PostgreSQL entegrasyon)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: it_pass
          POSTGRES_DB: hashmark_it
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "25", cache: maven }
      - name: mvn verify
        env:
          HASHMARK_TEST_DB_URL: jdbc:postgresql://localhost:5432/hashmark_it
          HASHMARK_TEST_DB_USER: postgres
          HASHMARK_TEST_DB_PASSWORD: it_pass
        run: ./mvnw -B verify

  monitoring-config:
    name: İzleme yapılandırması + alarm kuralı testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check-monitoring.sh

  docker-build:
    name: Docker imajları derlenir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t hashmark-backend:ci .
      # PITR: postgres + pgBackRest (docs/PITR.md). Uçtan uca test (scripts/pitr-e2e-test.sh) MinIO imajı
      # gerektirdiği için yerelde koşulur.
      - run: docker build -t hashmark-postgres:ci postgres
      - run: docker run --rm --entrypoint pgbackrest hashmark-postgres:ci version
