name: security

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"   # her pazartesi: yeni CVE'ler için
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    # NVD API'si yanıt vermezse araç saatlerce bekleyip yeniden deneyebiliyor (2026-10-22: 50+ dk takıldı)
    timeout-minutes: 60
    env:
      # dependency-check-maven'in varsayılan veri dizini (NVD'den indirilen CVE veritabanı)
      NVD_DATA_DIR: ~/.m2/repository/org/owasp/dependency-check-data
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "25", cache: maven }

      # NVD veritabanı (~300 bin CVE) her koşuda baştan indirilmesin: önceki günün verisi geri yüklenir,
      # araç yalnızca değişiklikleri çeker. Anahtar güne göre; aynı gün içindeki koşular aynı önbelleği paylaşır.
      - name: Gün
        id: day
        run: echo "value=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: NVD verisini geri yükle
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.NVD_DATA_DIR }}
          key: nvd-data-${{ steps.day.outputs.value }}
          restore-keys: nvd-data-

      - name: CVSS >= 7 build'i düşürür
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >
          ./mvnw -B org.owasp:dependency-check-maven:check
          -DfailBuildOnCVSS=7 -DnvdApiKey="$NVD_API_KEY"

      # Tarama açık bulup kırmızı bitse de (ya da zaman aşımına uğrasa da) indirilen veri saklanır;
      # yoksa her kırmızı koşu veritabanını yeniden indirirdi.
      - name: NVD verisini sakla
        if: always() && steps.day.outputs.value != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ env.NVD_DATA_DIR }}
          key: nvd-data-${{ steps.day.outputs.value }}
