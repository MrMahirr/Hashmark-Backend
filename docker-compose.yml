services:
  # === PostgreSQL ===
  postgres:
    image: postgres:16-alpine
    container_name: hashmark_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hashmark}
      POSTGRES_USER: ${POSTGRES_USER:-hashmark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hashmark-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hashmark} -d ${POSTGRES_DB:-hashmark}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # === Redis ===
  redis:
    image: redis:7-alpine
    container_name: hashmark_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - hashmark-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === Backend (Spring Boot) ===
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hashmark_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SERVER_PORT=8080
      - DATABASE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hashmark}
      - DATABASE_USERNAME=${POSTGRES_USER:-hashmark}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_CALLBACK_URL=${GITHUB_CALLBACK_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - RESEND_API_KEY=${RESEND_API_KEY:-placeholder}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-noreply@hashmark.dev}
    networks:
      - hashmark-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  hashmark-network:
    name: hashmark-network
    driver: bridge
