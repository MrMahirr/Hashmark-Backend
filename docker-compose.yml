services:
  # === PostgreSQL ===
  postgres:
    image: postgres:18-alpine
    container_name: hashmark_postgres
    restart: unless-stopped
    # Yavaş sorgu analizi için (scripts/pg-top-queries.sh). Değişiklik Postgres yeniden başlatması ister.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - log_min_duration_statement=1000
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hashmark}
      POSTGRES_USER: ${POSTGRES_USER:-hashmark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      # PG18 imajı veriyi /var/lib/postgresql/18/docker altında tutar; bu yüzden üst dizin bağlanır.
      # Yeni volume adı: eski PG16 volume'u (postgres_data) geri dönüş için dokunulmadan kalır.
      - postgres18_data:/var/lib/postgresql
    networks:
      - hashmark-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hashmark} -d ${POSTGRES_DB:-hashmark}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # === Backend (Spring Boot) ===
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hashmark_backend
    restart: unless-stopped
    # Kaynak sınırı: JVM -XX:MaxRAMPercentage=75 bu sınırı görür (OOM-kill yerine kontrollü heap).
    mem_limit: ${BACKEND_MEM_LIMIT:-1g}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SERVER_PORT=8080
      - DATABASE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hashmark}
      - DATABASE_USERNAME=${POSTGRES_USER:-hashmark}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_CALLBACK_URL=${GITHUB_CALLBACK_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL:-noreply@hashmark.dev}
      - BREVO_SENDER_NAME=${BREVO_SENDER_NAME:-Hashmark}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - REPORT_TIMEZONE=${REPORT_TIMEZONE:-Europe/Istanbul}
      - SWAGGER_ENABLED=${SWAGGER_ENABLED:-false}
      - RATE_LIMIT_AUTH_PER_MINUTE=${RATE_LIMIT_AUTH_PER_MINUTE:-30}
      - RATE_LIMIT_SCAN_PER_MINUTE=${RATE_LIMIT_SCAN_PER_MINUTE:-10}
      - GITHUB_OAUTH_SCOPE=${GITHUB_OAUTH_SCOPE:-repo,user:email}
      - DB_POOL_MAX_SIZE=${DB_POOL_MAX_SIZE:-15}
      - DB_POOL_MIN_IDLE=${DB_POOL_MIN_IDLE:-5}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
    networks:
      - hashmark-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  postgres18_data:
    driver: local

networks:
  hashmark-network:
    name: hashmark-network
    driver: bridge
