<!DOCTYPE html>
<html lang="{{lang}}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title}}</title></head>
<body style="margin:0;padding:24px;background:#EEF0EA;font-family:Arial,Helvetica,sans-serif;color:#111514;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#F9FAF7;border:1px solid #D2D8CF;border-radius:14px;">
    <tr><td style="padding:28px 28px 8px;">
      <div style="font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#566159;">Hashmark</div>
      <h1 style="margin:8px 0 0;font-size:26px;line-height:1.2;">{{title}}</h1>
      <p style="margin:10px 0 0;font-size:15px;color:#566159;">{{greeting}}</p>
    </td></tr>
    <tr><td style="padding:16px 28px;">
      <div style="font-size:44px;line-height:1;font-weight:700;">{{total}}</div>
      <div style="font-size:13px;color:#566159;margin-top:4px;">{{totalLabel}}</div>
    </td></tr>
    <tr><td style="padding:0 28px 8px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0">{{rows}}</table>
    </td></tr>
    <tr><td style="padding:8px 28px 4px;">{{topModule}}</td></tr>
    <tr><td style="padding:16px 28px 28px;">
      <a href="{{appUrl}}/dashboard" style="display:inline-block;background:#111514;color:#EEF0EA;text-decoration:none;font-weight:700;padding:12px 20px;border-radius:10px;">{{cta}}</a>
      <p style="margin:18px 0 0;font-size:12px;color:#566159;">{{footer}}</p>
    </td></tr>
  </table>
</body>
</html>
