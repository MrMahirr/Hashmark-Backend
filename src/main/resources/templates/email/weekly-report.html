<tr><td class="hm-pad" style="padding:32px 32px 8px;">
  <div class="hm-mute" style="font-family:'Courier New',Courier,monospace;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#525C55;">{{eyebrow}}</div>
  <h1 class="hm-text" style="margin:10px 0 0;font-family:Georgia,'Times New Roman',serif;font-size:34px;line-height:38px;font-weight:normal;color:#111514;">{{heading}}</h1>
  <p class="hm-mute" style="margin:12px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:24px;color:#525C55;">{{greeting}}</p>
</td></tr>

<!-- KPI -->
<tr><td class="hm-pad" style="padding:20px 32px 8px;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="hm-line" style="border:1px solid #D2D8CF;border-radius:14px;">
    <tr><td style="padding:20px 24px;">
      <div class="hm-mute" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#525C55;">{{totalLabel}}</div>
      <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
        <td class="hm-kpi hm-text" style="font-family:Georgia,'Times New Roman',serif;font-size:56px;line-height:60px;color:#111514;">{{total}}</td>
        <td style="padding-left:14px;font-family:'Courier New',Courier,monospace;font-size:13px;line-height:18px;color:#525C55;" class="hm-mute" valign="bottom">{{{delta}}}</td>
      </tr></table>
    </td></tr>
  </table>
</td></tr>

<!-- etiket dağılımı -->
<tr><td class="hm-pad" style="padding:16px 32px 4px;">
  <div class="hm-mute" style="font-family:'Courier New',Courier,monospace;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#525C55;padding-bottom:6px;">{{byLabelTitle}}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
    {{{rows}}}
  </table>
</td></tr>

{{{topModule}}}

<!-- eylem -->
<tr><td class="hm-pad" style="padding:24px 32px 32px;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
    <td class="hm-btn" style="background:#111514;border-radius:12px;border-bottom:4px solid #CDF24A;border-right:4px solid #CDF24A;">
      <a href="{{appUrl}}/dashboard" style="display:inline-block;padding:14px 24px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:20px;font-weight:bold;color:#EEF0EA;text-decoration:none;">{{cta}}</a>
    </td>
  </tr></table>
</td></tr>
