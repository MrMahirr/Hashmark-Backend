server:
  port: ${SERVER_PORT:8080}
  # Ters vekil (nginx) arkasında gerçek istemci IP'sini X-Forwarded-For'dan çözer (rate limit için).
  forward-headers-strategy: native

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

# Swagger prod'da kapalıdır; geliştirmede SWAGGER_ENABLED=true ile açılır.
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    path: /v1/api-docs
    enabled: ${SWAGGER_ENABLED:false}

github:
  client-id: ${GITHUB_CLIENT_ID}
  client-secret: ${GITHUB_CLIENT_SECRET}
  callback-url: ${GITHUB_CALLBACK_URL:http://localhost:3000/auth/callback}
  # Özel depo taraması için `repo` gerekir. Yalnızca açık depolar yeterliyse `public_repo,user:email` yapın.
  oauth-scope: ${GITHUB_OAUTH_SCOPE:repo,user:email}

# Bellek içi hız sınırları (istek/dakika). nginx limit_req ile birlikte çalışır.
rate-limit:
  auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:30}   # /auth/** (IP başına)
  scan-per-minute: ${RATE_LIMIT_SCAN_PER_MINUTE:10}   # POST /scan/** (kullanıcı başına)

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 900000
  refresh-token-expiry: 604800000

encryption:
  secret: ${ENCRYPTION_SECRET}

# E-posta: Brevo işlemsel API (https://app.brevo.com -> SMTP & API -> API Keys).
# Gönderici adresi Brevo'da doğrulanmış olmalıdır.
brevo:
  api-key: ${BREVO_API_KEY:}
  sender-email: ${BREVO_SENDER_EMAIL:noreply@hashmark.dev}
  sender-name: ${BREVO_SENDER_NAME:Hashmark}

app:
  url: ${APP_URL:http://localhost:3000}

report:
  timezone: ${REPORT_TIMEZONE:Europe/Istanbul}

async:
  core-pool-size: 2
  max-pool-size: 5
  queue-capacity: 50

scan:
  max-file-size-bytes: 1048576      # bundan büyük dosyalar atlanır
  max-files: 20000                  # tek taramada işlenecek en fazla dosya
  max-duration-seconds: 900         # tek taramanın en uzun süresi
  max-concurrent: 2                 # bu instance'ta aynı anda çalışacak tarama
  dispatch-interval-ms: 2000        # kuyruk kontrol aralığı
  heartbeat-timeout-minutes: 5      # kalp atışı gelmeyen RUNNING iş yeniden kuyruğa alınır
  max-attempts: 3                   # bir işin en fazla deneme sayısı
  blame-max-files: 25               # taramada git blame için en fazla dosya (0 = kapalı)
  max-rate-limit-wait-seconds: 60   # GitHub limiti için beklenebilecek en uzun süre
  excluded-dirs: node_modules,vendor,dist,build,out,target,.git,.next,.nuxt,.gradle,.idea,.vscode,coverage,__pycache__,.venv,venv,site-packages,bower_components,Pods,third_party,third-party
