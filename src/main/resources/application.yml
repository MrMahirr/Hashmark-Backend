server:
  port: ${SERVER_PORT:8080}
  # Ters vekil (nginx) arkasında gerçek istemci IP'sini X-Forwarded-For'dan çözer (rate limit için).
  forward-headers-strategy: native

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # Bağlantı havuzu: sınırlı ve hızlı başarısızlık (havuz dolunca 3 sn sonra hata, süresiz bekleme yok).
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:15}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:3000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1500000}     # 25 dk; proxy/Postgres zaman aşımlarından kısa
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:20000}
      # Oturum sınırları (Faz 2): kaçak sorgu, kilit kuyruğu ve açık bırakılmış transaction bağlantıyı kilitlemesin.
      # statement_timeout aşılırsa sorgu iptal edilir (SQLSTATE 57014); lock_timeout migrasyon kilidinin
      # arkasında istek birikmesini önler; idle_in_transaction açık kalmış transaction'ı keser.
      connection-init-sql: >-
        SET statement_timeout = '${DB_STATEMENT_TIMEOUT:30s}';
        SET lock_timeout = '${DB_LOCK_TIMEOUT:10s}';
        SET idle_in_transaction_session_timeout = '${DB_IDLE_IN_TX_TIMEOUT:60s}'
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Flyway havuzdan DEĞİL kendi bağlantısıyla çalışır (url/user verilince Boot ayrı DataSource kurar).
    # Böylece aşağıdaki oturum ayarları uygulama havuzuna sızmaz. İleride ayrı migrasyon rolü
    # (RLS, plan 5.5) için FLYWAY_USER/FLYWAY_PASSWORD verilir; boşsa uygulama kullanıcısı kullanılır.
    url: ${DATABASE_URL}
    user: ${FLYWAY_USER:${DATABASE_USERNAME}}
    password: ${FLYWAY_PASSWORD:${DATABASE_PASSWORD}}
    # Migrasyon kuralları: docs/MIGRATIONS.md. Uzun DDL'e (CONCURRENTLY) izin ver ama kilit beklemede hızlı düş.
    # (Boot listeyi tek dizgede birleştirir; ayırıcı ';' şart.)
    init-sqls: "SET statement_timeout = 0; SET lock_timeout = '${FLYWAY_LOCK_TIMEOUT:5s}'"
    out-of-order: false
    clean-disabled: true
    # Flyway PG'de varsayılan olarak pg_advisory_xact_lock ile AÇIK bir transaction tutar; CREATE INDEX
    # CONCURRENTLY bu transaction'ın bitmesini bekler ve kendi kendini kilitler (lock_timeout yoksa sonsuza dek).
    # Oturum düzeyi kilit bu kilitlenmeyi kaldırır (MigrationConventionsTest ile gerçek PG'de doğrulandı).
    postgresql:
      transactional-lock: false

# Swagger prod'da kapalıdır; geliştirmede SWAGGER_ENABLED=true ile açılır.
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    path: /v1/api-docs
    enabled: ${SWAGGER_ENABLED:false}

# Gözlemlenebilirlik: actuator AYRI bir portta (8081) çalışır; nginx bu portu yayınlamaz, compose'ta host'a açılmaz.
# Prometheus iç ağdan backend:8081/actuator/prometheus adresini çeker.
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,1s,3s
    tags:
      application: hashmark-backend

# Hata toplama (Sentry). DSN boşsa hiçbir şey gönderilmez. Kişisel veri (IP, başlık, gövde) gönderilmez.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:production}
  send-default-pii: false
  traces-sample-rate: 0.0

github:
  # Testlerde/yük testinde sahte GitHub'a yönlendirmek için; üretimde varsayılanlar kalır.
  oauth-url: ${GITHUB_OAUTH_URL:https://github.com}
  api-url: ${GITHUB_API_URL:https://api.github.com}
  client-id: ${GITHUB_CLIENT_ID}
  client-secret: ${GITHUB_CLIENT_SECRET}
  callback-url: ${GITHUB_CALLBACK_URL:http://localhost:3000/auth/callback}
  # Özel depo taraması için `repo` gerekir. Yalnızca açık depolar yeterliyse `public_repo,user:email` yapın.
  oauth-scope: ${GITHUB_OAUTH_SCOPE:repo,user:email}

# Bellek içi hız sınırları (istek/dakika). nginx limit_req ile birlikte çalışır.
rate-limit:
  auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:30}   # /auth/** (IP başına)
  scan-per-minute: ${RATE_LIMIT_SCAN_PER_MINUTE:10}   # POST /scan/** (kullanıcı başına)

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 900000
  refresh-token-expiry: 604800000

encryption:
  secret: ${ENCRYPTION_SECRET}

# E-posta: Brevo işlemsel API (https://app.brevo.com -> SMTP & API -> API Keys).
# Gönderici adresi Brevo'da doğrulanmış olmalıdır.
brevo:
  api-key: ${BREVO_API_KEY:}
  sender-email: ${BREVO_SENDER_EMAIL:noreply@hashmark.dev}
  sender-name: ${BREVO_SENDER_NAME:Hashmark}

app:
  url: ${APP_URL:http://localhost:3000}

report:
  timezone: ${REPORT_TIMEZONE:Europe/Istanbul}

# Dış servis (GitHub OAuth/repo listesi, Brevo) çağrı zaman aşımları. Tarama motoru için scan.http-* ayarlarına bakın.
http:
  client:
    connect-timeout-ms: ${HTTP_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${HTTP_READ_TIMEOUT_MS:10000}

# Tarama işçileri için havuz. Kuyruk dolarsa iş reddedilir (AbortPolicy): ScanJobDispatcher işi
# kuyruğa geri bırakır; başka bir çağıran reddedilirse API 503 + Retry-After döner. CallerRuns kullanılmaz.
async:
  core-pool-size: 2
  max-pool-size: 5
  queue-capacity: 50

# Veri saklama (plan Bölüm 5.6). Süreler gizlilik politikasında yazanla aynı olmalı.
retention:
  enabled: ${RETENTION_ENABLED:true}
  cron: "0 30 4 * * *"              # her gün 04:30 (03:00 yedeğinden sonra)
  scan-jobs-days: 90                # bitmiş işler (deponun son işi hariç)
  snapshots-detail-days: 90         # bundan eskiler depo başına haftada tek satır
  snapshots-months: 24              # bundan eskiler silinir
  notifications-read-days: 180      # okunmuş bildirimler (okunmamışlar kalır)
  batch-size: 5000

scan:
  github-api-url: ${GITHUB_API_URL:https://api.github.com}
  max-file-size-bytes: 1048576      # bundan büyük dosyalar atlanır
  max-files: 20000                  # tek taramada işlenecek en fazla dosya
  max-duration-seconds: 900         # tek taramanın en uzun süresi
  max-concurrent: ${SCAN_MAX_CONCURRENT:2}                 # bu instance'ta aynı anda çalışacak tarama
  dispatch-interval-ms: 2000        # kuyruk kontrol aralığı
  heartbeat-timeout-minutes: 5      # kalp atışı gelmeyen RUNNING iş yeniden kuyruğa alınır
  max-attempts: 3                   # bir işin en fazla deneme sayısı
  blame-max-files: 25               # taramada git blame için en fazla dosya (0 = kapalı)
  max-rate-limit-wait-seconds: 60   # GitHub limiti için beklenebilecek en uzun süre
  excluded-dirs: node_modules,vendor,dist,build,out,target,.git,.next,.nuxt,.gradle,.idea,.vscode,coverage,__pycache__,.venv,venv,site-packages,bower_components,Pods,third_party,third-party
